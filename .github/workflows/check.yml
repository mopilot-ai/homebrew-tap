name: Check cask
# A pull request: installs its Casks/mopilot.rb from a local tap on Apple silicon and on Intel, checks the app, and removes
# it (MoPilot's release workflow runs the same checks before it pushes a cask: mopilot-code-release homebrew-tap.yml).
# A push to main: runs what users run, `brew install --cask mopilot-ai/tap/mopilot` from this tap on GitHub, with the same checks.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['Casks/**', '.github/workflows/check.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'check-cask-${{ github.ref }}', cancel-in-progress: true }
env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  HOMEBREW_NO_ENV_HINTS: '1'
jobs:
  check:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Install the cask, check the app, and remove it
        env: { ARCH: '${{ matrix.arch }}', EVENT: '${{ github.event_name }}' }
        run: |
          set -euxo pipefail
          if [ ! -f Casks/mopilot.rb ]; then echo "No cask yet"; exit 0; fi
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/mopilot.rb)"
          if [ "$EVENT" = pull_request ]; then
            cask=mopilot-ai/check/mopilot
            brew tap-new --no-git mopilot-ai/check
            tap="$(brew --repository mopilot-ai/check)"
            mkdir -p "$tap/Casks"
            cp Casks/mopilot.rb "$tap/Casks/mopilot.rb"
            # Homebrew loads a third-party tap's casks only once trusted; installing by full name trusts it
            brew trust mopilot-ai/check
            brew style --cask "$cask"
            brew audit --cask --online "$cask"
            brew install --cask "$cask"
          else
            cask=mopilot-ai/tap/mopilot
            brew install --cask "$cask"
            brew audit --cask --online "$cask"
          fi
          app=/Applications/MoPilot.app
          test "$(defaults read "$app/Contents/Info" CFBundleShortVersionString)" = "$version"
          lipo -archs "$app/Contents/MacOS/MoPilot" | grep -qw "$ARCH"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          brew uninstall --cask --zap "$cask"
          test ! -e "$app"
